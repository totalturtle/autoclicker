<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1440px; height: 2560px; background: linear-gradient(160deg, #1e1b4b 0%, #1c1c1e 45%, #2d1b4b 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }

  .title {
    color: #ffffff;
    font-size: 96px;
    font-weight: 800;
    text-align: center;
    line-height: 1.25;
    margin-bottom: 106px;
    letter-spacing: -1px;
  }
  .title span { color: #a78bfa; }

  .phone-wrap {
    position: relative;
    width: 640px;
    height: 1307px;
  }

  .phone-frame {
    width: 640px;
    height: 1307px;
    background: #1a1a1a;
    border-radius: 80px;
    border: 13px solid #444;
    box-shadow: 0 0 0 2px #222, 0 54px 160px rgba(0,0,0,0.7), inset 0 0 0 1px #555;
    overflow: hidden;
    position: relative;
  }

  .phone-notch {
    position: absolute;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    width: 160px;
    height: 37px;
    background: #1a1a1a;
    border-radius: 27px;
    z-index: 10;
  }

  .phone-screen {
    width: 100%;
    height: 100%;
    background: #f0f0f5;
    border-radius: 69px;
    overflow: hidden;
  }

  .phone-screen img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top;
  }

  .badge {
    margin-top: 93px;
    display: flex;
    gap: 32px;
    align-items: center;
    justify-content: center;
  }
  .badge-item {
    background: rgba(167,139,250,0.15);
    border: 2px solid rgba(167,139,250,0.4);
    border-radius: 50px;
    padding: 21px 48px;
    color: #c4b5fd;
    font-size: 43px;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="title">화면 위에서<br><span>바로 제어</span>하세요</div>

  <div class="phone-wrap">
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="phone-screen">
        <img src="screen_overlay.png">
      </div>
    </div>
  </div>

  <div class="badge">
    <div class="badge-item">🖐 드래그 마커</div>
    <div class="badge-item">👁 오버레이 패널</div>
    <div class="badge-item">⚡ 즉시 실행</div>
  </div>
</body>
</html>
