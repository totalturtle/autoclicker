<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1024px;
    height: 500px;
    background: linear-gradient(135deg, #1e1b4b 0%, #1c1c1e 50%, #2d1b4b 100%);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* 배경 장식 원 */
  .deco-circle {
    position: absolute;
    border-radius: 50%;
    opacity: 0.08;
    background: #a78bfa;
  }
  .deco-circle.c1 { width: 400px; height: 400px; top: -120px; left: -80px; }
  .deco-circle.c2 { width: 300px; height: 300px; bottom: -100px; right: 200px; }
  .deco-circle.c3 { width: 150px; height: 150px; top: 30px; right: 80px; opacity: 0.05; }

  /* 왼쪽 텍스트 영역 */
  .left {
    padding-left: 72px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    z-index: 2;
  }

  .app-label {
    font-size: 18px;
    color: #a78bfa;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .app-name {
    font-size: 58px;
    font-weight: 800;
    color: #ffffff;
    line-height: 1.1;
    letter-spacing: -1px;
  }
  .app-name span { color: #a78bfa; }

  .tagline {
    font-size: 22px;
    color: #c4b5fd;
    font-weight: 400;
    line-height: 1.5;
  }

  .badges {
    display: flex;
    gap: 12px;
    margin-top: 8px;
  }
  .badge {
    background: rgba(167,139,250,0.15);
    border: 1.5px solid rgba(167,139,250,0.35);
    border-radius: 50px;
    padding: 8px 20px;
    color: #c4b5fd;
    font-size: 15px;
    font-weight: 600;
  }

  /* 오른쪽 비주얼 */
  .right {
    padding-right: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
    position: relative;
    width: 340px;
    height: 340px;
  }

  /* 클릭 포인트 마커들 */
  .marker {
    position: absolute;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    color: white;
    font-size: 22px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  .marker.purple { background: #7c6af7; width: 72px; height: 72px; }
  .marker.pink   { background: #e57373; width: 64px; height: 64px; }
  .marker.sm     { background: #7c6af7; width: 52px; height: 52px; font-size: 16px; }

  .m1 { top: 40px;  left: 80px; }
  .m2 { top: 160px; left: 20px; }
  .m3 { top: 90px;  right: 60px; }
  .m4 { bottom: 60px; left: 120px; }
  .m5 { bottom: 100px; right: 30px; }

  /* 연결선 */
  svg.lines {
    position: absolute;
    width: 100%; height: 100%;
    top: 0; left: 0;
  }
  svg.lines line {
    stroke: rgba(167,139,250,0.25);
    stroke-width: 2;
    stroke-dasharray: 6 4;
  }
</style>
</head>
<body>
  <div class="deco-circle c1"></div>
  <div class="deco-circle c2"></div>
  <div class="deco-circle c3"></div>

  <div class="left">
    <div class="app-label">Auto Clicker</div>
    <div class="app-name">자동탭<br><span>(오토클릭)</span></div>
    <div class="tagline">화면 터치를 자동화하세요<br>반복 작업을 단 한 번의 설정으로</div>
    <div class="badges">
      <div class="badge">🖐 멀티 포인트</div>
      <div class="badge">⚡ 오버레이 제어</div>
      <div class="badge">🎯 색상 트리거</div>
    </div>
  </div>

  <div class="right">
    <svg class="lines">
      <line x1="116" y1="76" x2="56"  y2="196"/>
      <line x1="116" y1="76" x2="196" y2="126"/>
      <line x1="56"  y1="196" x2="156" y2="280"/>
      <line x1="196" y1="126" x2="270" y2="240"/>
    </svg>
    <div class="marker pink m1">3·1</div>
    <div class="marker purple m2">1</div>
    <div class="marker sm m3">3</div>
    <div class="marker purple m4">2</div>
    <div class="marker sm m5">4</div>
  </div>
</body>
</html>
